# This is a Databricks asset bundle definition for dab_bundles_tut.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_bundles_tut
  uuid: 5a0e40f3-1d14-41f3-b242-36f2611f1b45

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-fdf4e8b7-26d8.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-fdf4e8b7-26d8.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/narahari.pujala@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/narahari.pujala@gmail.com/prod/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
